<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mapa ciudadano de la red ferroviaria española con datos abiertos oficiales." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23244f5c'/><path d='M8 22 L24 10' stroke='%23f4efe6' stroke-width='3' stroke-linecap='round'/><circle cx='8' cy='22' r='3' fill='%23f4efe6'/><circle cx='24' cy='10' r='3' fill='%23f4efe6'/></svg>" />
    <script>
      // Aplica el tema guardado antes de pintar la página (evita un parpadeo blanco).
      try {
        const t = localStorage.getItem('theme');
        document.documentElement.dataset.theme =
          t === 'dark' || t === 'light' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <title>VíaClara · Red ferroviaria de España</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
